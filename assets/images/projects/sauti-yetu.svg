<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Sauti Yetu healthcare triage assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f22"/>
      <stop offset="0.5" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#241a4d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f83ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f83ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="270" cy="200" r="260" fill="url(#g1)"/>
  <circle cx="960" cy="520" r="300" fill="url(#g2)"/>

  <!-- title chip -->
  <g transform="translate(70,58)">
    <rect width="250" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#c9a875" stroke-opacity="0.5"/>
    <circle cx="30" cy="23" r="8" fill="#34d399"/>
    <text x="52" y="31" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#e6ebff">SAUTI YETU</text>
  </g>

  <!-- clinical reasoning graph (right) -->
  <g stroke="#4f83ff" stroke-width="3" opacity="0.5">
    <line x1="820" y1="200" x2="960" y2="300"/>
    <line x1="960" y1="300" x2="900" y2="470"/>
    <line x1="960" y1="300" x2="1080" y2="420"/>
    <line x1="820" y1="200" x2="1040" y2="180"/>
  </g>
  <g>
    <circle cx="820" cy="200" r="20" fill="#4f83ff"/><circle cx="820" cy="200" r="34" fill="#4f83ff" opacity="0.25" filter="url(#soft)"/>
    <circle cx="1040" cy="180" r="16" fill="#22d3ee"/>
    <circle cx="960" cy="300" r="24" fill="#a855f7"/><circle cx="960" cy="300" r="40" fill="#a855f7" opacity="0.25" filter="url(#soft)"/>
    <circle cx="900" cy="470" r="16" fill="#f59e0b"/>
    <circle cx="1080" cy="420" r="16" fill="#34d399"/>
  </g>

  <!-- main app card (left) -->
  <g transform="translate(90,150)">
    <rect width="560" height="400" rx="26" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.16"/>
    <!-- header -->
    <rect x="28" y="28" width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.14"/>
    <g transform="translate(400,24)">
      <rect width="60" height="34" rx="17" fill="#4f83ff" fill-opacity="0.9"/>
      <rect x="66" width="60" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
      <text x="30" y="23" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">SW</text>
      <text x="96" y="23" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#c9d4f5" text-anchor="middle">EN</text>
    </g>

    <!-- incoming bubble (Swahili) -->
    <g transform="translate(28,84)">
      <rect width="300" height="66" rx="18" fill="#ffffff" fill-opacity="0.10"/>
      <text x="24" y="42" font-family="Georgia, serif" font-size="30" fill="#e6ebff">Nina homa kali</text>
    </g>
    <!-- outgoing bubble (English) -->
    <g transform="translate(232,168)">
      <rect width="300" height="66" rx="18" fill="#4f83ff" fill-opacity="0.85"/>
      <text x="24" y="42" font-family="Georgia, serif" font-size="30" fill="#ffffff">High fever noted</text>
    </g>

    <!-- urgency + triage row -->
    <g transform="translate(28,258)">
      <rect width="150" height="40" rx="12" fill="#f87171" fill-opacity="0.9"/>
      <text x="75" y="27" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1" fill="#2a0b0b" text-anchor="middle">RED FLAG</text>
      <rect x="166" y="0" width="120" height="40" rx="12" fill="#f59e0b" fill-opacity="0.85"/>
      <text x="226" y="27" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#3a2400" text-anchor="middle">URGENT</text>
    </g>

    <!-- TTS waveform -->
    <g transform="translate(28,326)" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="30" x2="0" y2="52"/><line x1="20" y1="14" x2="20" y2="68"/>
      <line x1="40" y1="26" x2="40" y2="56"/><line x1="60" y1="6" x2="60" y2="76"/>
      <line x1="80" y1="22" x2="80" y2="60"/><line x1="100" y1="16" x2="100" y2="66"/>
      <line x1="120" y1="34" x2="120" y2="48"/><line x1="140" y1="10" x2="140" y2="72"/>
      <line x1="160" y1="28" x2="160" y2="54"/>
    </g>
    <g transform="translate(220,336)" fill="#9fb0d9" font-family="Inter, Arial, sans-serif" font-size="18">
      <text x="0" y="22">Text-to-speech reply in local language</text>
    </g>
  </g>
</svg>
